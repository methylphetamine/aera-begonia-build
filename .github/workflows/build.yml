name: AERA build (begonia)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'twrp_begonia-bp2a-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'adbd recoveryimage'
      manifest_branch:
        description: 'AERA manifest branch'
        required: false
        default: 'aera-16.0'
      jobs:
        description: 'Parallel make jobs'
        required: false
        default: '4'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MANIFEST_URL: 'https://github.com/AERA-Recovery/android_manifest.git'
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'aera-16.0' }}
  SRC_DIR: 'aosp'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'
  CCACHE_EXEC: '/usr/bin/ccache'

jobs:
  build:
    name: Build AERA recovery image and flashable package
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show parameters
        run: |
          echo "manifest   : $MANIFEST_URL @ $MANIFEST_BRANCH"
          echo "lunch      : ${{ inputs.makefile || 'twrp_begonia-bp2a-eng' }}"
          echo "target     : ${{ inputs.build_target || 'adbd recoveryimage' }}"
          echo "jobs       : ${{ inputs.jobs || '4' }}"
          echo "ccache     : ${{ inputs.ccache || 'true' }}"
          echo "free space before:"
          df -h /

      - name: Free disk space
        run: |
          # The AOSP 16 sync needs every byte it can get: a full checkout plus
          # .repo used to fill the runner's disk at ~30 min into the sync, so
          # the job died with "No space left on device" before compiling.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache \
                    /usr/local/share/boost /usr/share/swift /opt/microsoft \
                    /usr/local/.ghcup /usr/local/share/powershell \
                    /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/mono \
                    /usr/share/java /opt/google /usr/local/julia* \
                    /usr/local/share/chromium /usr/local/share/vcpkg || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /var/lib/docker/* 2>/dev/null || true
          # No swap file yet; it is created after the sync so it does not
          # compete with the checkout for disk space.
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg patch \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush rsync schedtool squashfs-tools unzip \
            xsltproc zip zlib1g-dev openjdk-17-jdk-headless jq
          java -version 2>&1

      - name: Set JDK 17
        run: |
          if [ -n "$JAVA_HOME_17_X64" ] && [ -x "$JAVA_HOME_17_X64/bin/java" ]; then
            J="$JAVA_HOME_17_X64"
          elif [ -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
            # The hosted toolcache was removed by the disk-space step.
            J=/usr/lib/jvm/java-17-openjdk-amd64
          else
            J=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          fi
          echo "JAVA_HOME=$J" >> "$GITHUB_ENV"
          "$J/bin/java" -version 2>&1

      - name: Install repo launcher
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Sync AERA source
        run: |
          set -e
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"
          df -h /
          # Partial clone keeps .repo small: blobs are fetched on checkout
          # instead of holding a second full copy of the tree during sync.
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --partial-clone
          # Recovery does not build CTS, the SDK or the kernel prebuilts
          # (begonia uses a prebuilt Image.gz). Dropping them before sync saves
          # several GB. Do NOT drop test/*: test/app_compat/csuite defines the
          # csuite_test module type that other Android.bp files reference, and
          # dropping it breaks soong bootstrap.
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/no-extra.xml <<'XML'
          <manifest>
            <remove-project path="cts" />
            <remove-project path="sdk" />
            <remove-project path="development" />
            <remove-project path="kernel/prebuilts/6.1/arm64" />
            <remove-project path="kernel/prebuilts/6.6/arm64" />
            <remove-project path="kernel/prebuilts/6.12/arm64" />
            <remove-project path="kernel/prebuilts/common-modules/trusty/6.6/arm64" />
            <remove-project path="kernel/prebuilts/common-modules/trusty/6.12/arm64" />
          </manifest>
          XML
          repo sync -c --force-sync --no-clone-bundle --no-tags -j${{ inputs.jobs || '4' }}
          df -h /

      - name: Trim disk before build
        run: |
          du -sh "$SRC_DIR" 2>/dev/null || true
          find "$SRC_DIR/prebuilts" -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find "$SRC_DIR/.repo/project-objects" -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show
          free -h
          df -h /

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-aera-begonia-${{ github.run_id }}
          restore-keys: |
            ccache-aera-begonia-

      - name: ccache configuration
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 6G
          ccache --zero-stats || true

      - name: Install device tree
        run: |
          set -e
          mkdir -p "$SRC_DIR/device/xiaomi"
          rm -rf "$SRC_DIR/device/xiaomi/begonia"
          cp -a device/xiaomi/begonia "$SRC_DIR/device/xiaomi/begonia"

      - name: Compile
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          BUILD_JOBS: ${{ inputs.jobs || '4' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'twrp_begonia-bp2a-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'adbd recoveryimage' }}
          BUILD_USERNAME: A_X
          BUILD_HOSTNAME: poxproject
          AERA_BUILD_DEVICE: begonia
          AERA_BUILD_STATUS: Unofficial
          AERA_BUILD_TYPE: Beta
          AERA_PRODUCT_PREFIX: AERA
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          : > build.log
          set +e
          source build/envsetup.sh >> build.log 2>&1
          ENVSETUP_RC=$?
          set -e
          echo "envsetup exited ${ENVSETUP_RC}"
          tail -n 20 build.log || true
          if [ -z "$ANDROID_BUILD_TOP" ]; then
            echo "::error::envsetup did not initialise ANDROID_BUILD_TOP"
            exit 1
          fi
          lunch "$MAKEFILE_NAME"
          mka -j"$BUILD_JOBS" $BUILD_TARGET 2>&1 | tee -a build.log

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-begonia-build-log
          path: ${{ env.SRC_DIR }}/build.log
          if-no-files-found: ignore

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aera-begonia-recovery
          path: |
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.img
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.zip
          if-no-files-found: warn

      - name: Upload to Gofile
        id: gofile
        if: success()
        continue-on-error: true
        run: |
          IMG="$SRC_DIR/out/target/product/begonia/recovery.img"
          if [ ! -f "$IMG" ]; then
            echo "::warning::recovery.img not found; skipping Gofile upload"
            exit 0
          fi
          SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$IMG")
          echo "recovery_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "recovery_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "recovery.img SHA256: $SHA ($SIZE bytes)"
          SRV=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty')
          if [ -z "$SRV" ]; then
            echo "::warning::Gofile returned no upload server"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/gofile.json -w '%{http_code}' \
            -F "file=@${IMG}" "https://${SRV}.gofile.io/contents/uploadfile" || true)
          URL=$(jq -r '.data.downloadPage // empty' /tmp/gofile.json 2>/dev/null || true)
          if [ "$HTTP" != "200" ] || [ -z "$URL" ]; then
            echo "::warning::Gofile upload failed (HTTP ${HTTP:-?})"
            cat /tmp/gofile.json 2>/dev/null || true
            exit 0
          fi
          echo "gofile_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Gofile: $URL (recovery.img)"

      - name: Notify Telegram on success
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          GOFILE_URL: ${{ steps.gofile.outputs.gofile_url }}
          SHA: ${{ steps.gofile.outputs.recovery_sha256 }}
          SIZE: ${{ steps.gofile.outputs.recovery_size }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured"
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT=$(printf 'AERA begonia build finished\nrecovery.img SHA256: %s\nsize: %s bytes\nGofile: %s\nRun: %s' \
            "${SHA:-n/a}" "${SIZE:-?}" "${GOFILE_URL:-n/a}" "$RUN_URL")
          for CHAT in "$TG_CHAT" "$TG_CHAT_2"; do
            [ -z "$CHAT" ] && continue
            curl -sS -o /tmp/tg.json \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=${TEXT}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true
            jq -e '.ok == true' /tmp/tg.json >/dev/null 2>&1 \
              && echo "Telegram: success message sent to $CHAT" \
              || echo "::warning::Telegram success message failed for $CHAT"
          done

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          JOB=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            | jq -r '.jobs[0].steps[]?|select(.conclusion=="failure")|.name' | head -1)
          TEXT=$(printf 'AERA begonia build FAILED at step: %s\nRun: %s' "${JOB:-unknown}" "$RUN_URL")
          for CHAT in "$TG_CHAT" "$TG_CHAT_2"; do
            [ -z "$CHAT" ] && continue
            curl -sS -o /tmp/tg.json \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=${TEXT}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true
            jq -e '.ok == true' /tmp/tg.json >/dev/null 2>&1 \
              && echo "Telegram: failure message sent to $CHAT" \
              || echo "::warning::Telegram failure message failed for $CHAT"
          done

      - name: Create GitHub release
        if: github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.img
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.zip
          generate_release_notes: true
