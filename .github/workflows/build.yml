name: AERA build (begonia)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'twrp_begonia-bp2a-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'adbd recoveryimage'
      manifest_branch:
        description: 'AERA manifest branch'
        required: false
        default: 'aera-16.0'
      jobs:
        description: 'Parallel make jobs (2 is the safe maximum on a 16 GB hosted runner)'
        required: false
        default: '2'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MANIFEST_URL: 'https://github.com/AERA-Recovery/android_manifest.git'
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || 'aera-16.0' }}
  SRC_DIR: 'aosp'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'
  CCACHE_EXEC: '/usr/bin/ccache'

jobs:
  build:
    name: Build AERA recovery image and flashable package
    runs-on: ubuntu-22.04-8core
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show parameters
        run: |
          echo "manifest   : $MANIFEST_URL @ $MANIFEST_BRANCH"
          echo "lunch      : ${{ inputs.makefile || 'twrp_begonia-bp2a-eng' }}"
          echo "target     : ${{ inputs.build_target || 'adbd recoveryimage' }}"
          echo "jobs       : ${{ inputs.jobs || '2' }}"
          echo "ccache     : ${{ inputs.ccache || 'true' }}"
          echo "free space before:"
          df -h /

      - name: Free disk space
        run: |
          # The AOSP 16 sync needs every byte it can get: a full checkout plus
          # .repo used to fill the runner's disk at ~30 min into the sync, so
          # the job died with "No space left on device" before compiling.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache \
                    /usr/local/share/boost /usr/share/swift /opt/microsoft \
                    /usr/local/.ghcup /usr/local/share/powershell \
                    /usr/local/aws-cli /usr/local/aws-sam-cli /usr/lib/mono \
                    /usr/share/java /opt/google /usr/local/julia* \
                    /usr/local/share/chromium /usr/local/share/vcpkg || true
          sudo docker system prune -af --volumes 2>/dev/null || true
          sudo rm -rf /var/lib/docker/* 2>/dev/null || true
          # No swap file yet; it is created after the sync so it does not
          # compete with the checkout for disk space.
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg patch \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush rsync schedtool squashfs-tools unzip \
            xsltproc zip zlib1g-dev openjdk-17-jdk-headless jq
          java -version 2>&1

      - name: Set JDK 17
        run: |
          if [ -n "$JAVA_HOME_17_X64" ] && [ -x "$JAVA_HOME_17_X64/bin/java" ]; then
            J="$JAVA_HOME_17_X64"
          elif [ -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
            # The hosted toolcache was removed by the disk-space step.
            J=/usr/lib/jvm/java-17-openjdk-amd64
          else
            J=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          fi
          echo "JAVA_HOME=$J" >> "$GITHUB_ENV"
          "$J/bin/java" -version 2>&1

      - name: Install repo launcher
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Sync AERA source
        run: |
          set -e
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"
          df -h /
          # Partial clone keeps .repo small: blobs are fetched on checkout
          # instead of holding a second full copy of the tree during sync.
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --partial-clone
          # twrp-default.xml already includes AERA's remove-minimal.xml, so
          # the recovery tree is ~410 projects instead of the full ~989.
          # Do not copy remove-minimal.xml into local_manifests again: repo
          # rejects the second application as a removal of non-existent
          # projects.
          mkdir -p .repo/local_manifests
          # Recovery does not build CTS, the SDK or the kernel prebuilts
          # (begonia uses a prebuilt Image.gz). Dropping them before sync saves
          # several GB.  The only test project we must keep is
          # test/app_compat/csuite: it provides the csuite_test module type that
          # art/test and frameworks/base test Android.bp files reference.
          # Keeping the whole test tree makes soong_build analyse thousands of
          # extra modules and is what pushed this 16 GB runner into swap death.
          cat > .repo/local_manifests/no-extra.xml <<'XML'
          <manifest>
            <remove-project path="cts" />
            <remove-project path="sdk" />
            <remove-project path="development" />
            <remove-project path="kernel/prebuilts/6.1/arm64" />
            <remove-project path="kernel/prebuilts/6.6/arm64" />
            <remove-project path="kernel/prebuilts/6.12/arm64" />
            <remove-project path="kernel/prebuilts/common-modules/trusty/6.6/arm64" />
            <remove-project path="kernel/prebuilts/common-modules/trusty/6.12/arm64" />
            <!-- Keep csuite for csuite_test; drop every other test project
                 that remove-minimal.xml leaves in the manifest. -->
            <remove-project path="test/dittosuite" />
            <remove-project path="test/robolectric-extensions" />
            <remove-project path="test/suite_harness" />
            <remove-project path="test/vts" />
            <remove-project path="test/vts-testcase/hal" />
          </manifest>
          XML
          # Sync with more jobs than the compile step: this is network/disk
          # bound, and the old -j1 sync alone took about an hour.
          repo sync -c --force-sync --no-clone-bundle --no-tags -j4
          df -h /

      - name: Trim disk before build
        run: |
          du -sh "$SRC_DIR" 2>/dev/null || true
          find "$SRC_DIR/prebuilts" -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find "$SRC_DIR/.repo/project-objects" -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Prune test-only source trees
        run: |
          # soong_build parses every Android.bp in the checkout before the
          # first compiler starts.  On AERA 16 that graph is larger than the
          # 16 GB hosted runner can hold; every run before this prune died
          # silently while soong_build was analysing modules.
          #
          # Test modules are never part of recoveryimage, but they account for
          # 480 of the 921 Android.bp files in frameworks/base alone.  Drop the
          # test-only directories before Soong scans the tree, but keep any
          # tree that a surviving Android.bp sources files from.  Deleting
          # system/tools/aidl/tests, for example, makes the aidlInterface
          # modules in its parent Android.bp fail with "No sources provided in
          # tests" and then panic.  test/app_compat/csuite is also kept: it
          # provides the csuite_test module type referenced by art/test.
          #
          # The scan below is a fixpoint: blueprints inside a tree that is
          # being deleted do not count as references, because they disappear
          # too, and a kept tree protects any test dir nested inside it.
          cd "$SRC_DIR"
          python3 - <<'PY'
          import os
          import re
          import shutil

          ROOTS = ["art", "bionic", "frameworks", "hardware", "libcore",
                   "packages", "system", "external", "vendor"]
          TEST_NAMES = {"tests", "androidTest", "fuzz", "benchmarks"}
          SKIP_DIRS = {"out", ".repo", ".git"}
          # aidlInterface modules in system/tools/aidl/Android.bp take their
          # API dumps from tests/, so this tree must always survive.
          ALWAYS_KEEP = {"system/tools/aidl/tests"}

          def walk(root):
              for dirpath, dirnames, _ in os.walk(root):
                  dirnames[:] = [d for d in dirnames
                                 if not d.startswith(".") and d not in SKIP_DIRS]
                  yield dirpath

          def collect_candidates():
              cand = set()
              for root in ROOTS:
                  if not os.path.isdir(root):
                      continue
                  for dirpath in walk(root):
                      if "aidl_api" in dirpath.split(os.sep):
                          continue
                      if os.path.basename(dirpath) in TEST_NAMES:
                          cand.add(os.path.normpath(dirpath))
              if os.path.isdir("art/test"):
                  cand.add("art/test")
              if os.path.isdir("libcore"):
                  for dirpath in walk("libcore"):
                      if os.path.basename(dirpath) == "test":
                          cand.add(os.path.normpath(dirpath))
              return cand

          def deepest_owner(path, cand):
              # Deepest test dir that contains path, or None for a survivor.
              path = os.path.normpath(path)
              while path not in ("", ".", os.sep):
                  if path in cand:
                      return path
                  path = os.path.dirname(path)
              return None

          cand = collect_candidates()
          test_re = re.compile(r'(^|/)(tests?|androidTest|fuzz|benchmarks)/')
          quoted_re = re.compile(r'"((?:[^"\\]|\\.)*)"')

          # (owning test tree or None, referenced test trees)
          blueprints = []
          for dirpath, dirnames, filenames in os.walk("."):
              dirnames[:] = [d for d in dirnames
                             if not d.startswith(".") and d not in SKIP_DIRS]
              if "Android.bp" not in filenames:
                  continue
              owner = deepest_owner(dirpath, cand)
              try:
                  with open(os.path.join(dirpath, "Android.bp"),
                            encoding="utf-8", errors="replace") as fh:
                      text = fh.read()
              except OSError:
                  continue
              refs = set()
              for s in quoted_re.findall(text):
                  if not test_re.search(s) or s.startswith(":") or "$" in s:
                      continue
                  target = os.path.normpath(os.path.join(dirpath, s))
                  for c in cand:
                      if target == c or target.startswith(c + os.sep):
                          refs.add(c)
              if refs:
                  blueprints.append((owner, refs))

          # Fixpoint: a blueprint's sources only matter while its own tree
          # survives.
          keep = set(ALWAYS_KEEP)
          changed = True
          while changed:
              changed = False
              for c in cand:
                  if c not in keep and any(c != k and c.startswith(k + os.sep)
                                           for k in keep):
                      keep.add(c)
                      changed = True
              for owner, refs in blueprints:
                  if owner is not None and owner not in keep:
                      continue
                  for c in refs:
                      if c not in keep:
                          keep.add(c)
                          changed = True

          removed = []
          for c in sorted(cand - keep, key=len, reverse=True):
              if "aidl_api" in c.split(os.sep):
                  continue
              if os.path.isdir(c):
                  shutil.rmtree(c, ignore_errors=True)
                  removed.append(c)

          print(f"removed {len(removed)} test-only trees; kept {len(keep)}")
          for c in sorted(keep):
              print(f"  kept (needed): {c}")
          PY
          echo "Android.bp files remaining: $(find . -name Android.bp -not -path './out/*' | wc -l)"
          du -sh .
          df -h /


      - name: Add swap and tune memory pressure
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          # Ubuntu's systemd-oomd kills the whole runner cgroup when memory
          # pressure crosses its threshold.  AOSP's Kati phase can briefly use
          # most of the 16 GB, and the result is exit 143 with no compiler
          # error.  Let the kernel OOM killer pick a compiler instead.
          sudo systemctl stop systemd-oomd systemd-oomd.socket 2>/dev/null || true
          sudo systemctl disable systemd-oomd systemd-oomd.socket 2>/dev/null || true
          sudo systemctl stop earlyoom 2>/dev/null || true
          echo "oomd: $(systemctl is-active systemd-oomd 2>/dev/null || echo absent)"

          # Keep disk swap as a safety valve, but do not make it the first
          # choice: swapping soong_build to disk is what turns a slow analysis
          # step into a runner that stops answering GitHub.  zram/compressed
          # swap was tried in earlier runs and did not prevent the shutdown,
          # so use a plain 8 GB file and a low swappiness.
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile
          sudo sysctl -w vm.swappiness=10 || true
          sudo sysctl -w vm.vfs_cache_pressure=50 || true
          swapon --show
          free -h
          df -h /

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-aera-begonia-${{ github.run_id }}
          restore-keys: |
            ccache-aera-begonia-

      - name: ccache configuration
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 4G
          ccache --zero-stats || true

      - name: Install device tree
        run: |
          set -e
          mkdir -p "$SRC_DIR/device/xiaomi"
          rm -rf "$SRC_DIR/device/xiaomi/begonia"
          cp -a device/xiaomi/begonia "$SRC_DIR/device/xiaomi/begonia"

      - name: Compile
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          MALLOC_ARENA_MAX: '2'
          # soong_build is the memory peak.  After the test prune its live
          # heap should be well under the runner's 16 GB, so give Go enough
          # headroom that it does not GC-thrash (the old 4 GiB limit made the
          # analysis silent for 20+ minutes and then killed the runner).
          # GOMAXPROCS=2 leaves the other two cores for the runner agent, so
          # GitHub keeps receiving heartbeats while Soong analyses modules.
          GOGC: '50'
          GOMEMLIMIT: '10GiB'
          GOMAXPROCS: '2'
          BUILD_JOBS: ${{ inputs.jobs || '2' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'twrp_begonia-bp2a-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'adbd recoveryimage' }}
          BUILD_USERNAME: A_X
          BUILD_HOSTNAME: poxproject
          AERA_BUILD_DEVICE: begonia
          AERA_BUILD_STATUS: Unofficial
          AERA_BUILD_TYPE: Beta
          AERA_PRODUCT_PREFIX: AERA
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          : > build.log

          # Memory/disk sampler.  Write each sample through tee so it reaches
          # both monitor.log and the live job log immediately; the previous
          # tail -f setup buffered its output and often lost the last sample
          # when the runner was recycled.
          : > monitor.log
          ( set +e
            while :; do
              {
                echo "=== $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="
                free -h
                cat /proc/pressure/memory 2>/dev/null
                df -h "$SRC_DIR" / 2>/dev/null
                ps -eo pid,rss,pcpu,comm --sort=-rss | head -12
                # dmesg needs root on the hosted runner; never let it kill the
                # sampler subshell (set -e is inherited from the step shell).
                sudo dmesg -T 2>/dev/null | tail -20
              } | stdbuf -oL -eL tee -a monitor.log
              sleep 30
            done ) &
          MON_PID=$!
          echo "monitor pid $MON_PID -> $SRC_DIR/monitor.log"

          # Never run more than two compilers on the 16 GB hosted runner.  A
          # dispatch with jobs=4 still succeeds, it is just clamped here.
          JOBS="$BUILD_JOBS"
          case "$JOBS" in ''|*[!0-9]*) JOBS=2 ;; esac
          if [ "$JOBS" -gt 2 ]; then
            echo "clamping -j$JOBS to -j2: 16 GB runner OOM/thrash safeguard"
            JOBS=2
          fi
          echo "make jobs: $JOBS"

          set +e
          source build/envsetup.sh >> build.log 2>&1
          ENVSETUP_RC=$?
          set -e
          echo "envsetup exited ${ENVSETUP_RC}"
          tail -n 20 build.log || true
          if [ -z "$ANDROID_BUILD_TOP" ]; then
            echo "::error::envsetup did not initialise ANDROID_BUILD_TOP"
            kill "$MON_PID" 2>/dev/null || true
            exit 1
          fi
          lunch "$MAKEFILE_NAME"
          set +e
          mka -j"$JOBS" $BUILD_TARGET 2>&1 | tee -a build.log
          RC=${PIPESTATUS[0]}
          kill "$MON_PID" 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "===== tail build.log (last 250 lines) ====="
            tail -n 250 build.log || true
            echo "===== dmesg (last 80 lines) ====="
            sudo dmesg -T 2>/dev/null | tail -80 || true
            echo "===== memory ====="
            free -h || true
            echo "===== top rss ====="
            ps -eo pid,rss,pcpu,comm --sort=-rss 2>/dev/null | head -15 || true
          fi
          exit "$RC"

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aera-begonia-build-log
          path: |
            ${{ env.SRC_DIR }}/build.log
            ${{ env.SRC_DIR }}/monitor.log
          if-no-files-found: ignore

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aera-begonia-recovery
          path: |
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.img
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.zip
          if-no-files-found: warn

      - name: Upload to Gofile
        id: gofile
        if: success()
        continue-on-error: true
        run: |
          IMG="$SRC_DIR/out/target/product/begonia/recovery.img"
          if [ ! -f "$IMG" ]; then
            echo "::warning::recovery.img not found; skipping Gofile upload"
            exit 0
          fi
          SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$IMG")
          echo "recovery_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "recovery_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "recovery.img SHA256: $SHA ($SIZE bytes)"
          SRV=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name // empty')
          if [ -z "$SRV" ]; then
            echo "::warning::Gofile returned no upload server"
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/gofile.json -w '%{http_code}' \
            -F "file=@${IMG}" "https://${SRV}.gofile.io/contents/uploadfile" || true)
          URL=$(jq -r '.data.downloadPage // empty' /tmp/gofile.json 2>/dev/null || true)
          if [ "$HTTP" != "200" ] || [ -z "$URL" ]; then
            echo "::warning::Gofile upload failed (HTTP ${HTTP:-?})"
            cat /tmp/gofile.json 2>/dev/null || true
            exit 0
          fi
          echo "gofile_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Gofile: $URL (recovery.img)"

      - name: Notify Telegram on success
        if: success()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          GOFILE_URL: ${{ steps.gofile.outputs.gofile_url }}
          SHA: ${{ steps.gofile.outputs.recovery_sha256 }}
          SIZE: ${{ steps.gofile.outputs.recovery_size }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured"
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          TEXT=$(printf 'AERA begonia build finished\nrecovery.img SHA256: %s\nsize: %s bytes\nGofile: %s\nRun: %s' \
            "${SHA:-n/a}" "${SIZE:-?}" "${GOFILE_URL:-n/a}" "$RUN_URL")
          for CHAT in "$TG_CHAT" "$TG_CHAT_2"; do
            [ -z "$CHAT" ] && continue
            curl -sS -o /tmp/tg.json \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=${TEXT}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true
            jq -e '.ok == true' /tmp/tg.json >/dev/null 2>&1 \
              && echo "Telegram: success message sent to $CHAT" \
              || echo "::warning::Telegram success message failed for $CHAT"
          done

      - name: Notify Telegram on failure
        if: failure()
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CHAT_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          JOB=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            | jq -r '.jobs[0].steps[]?|select(.conclusion=="failure")|.name' | head -1)
          TEXT=$(printf 'AERA begonia build FAILED at step: %s\nRun: %s' "${JOB:-unknown}" "$RUN_URL")
          for CHAT in "$TG_CHAT" "$TG_CHAT_2"; do
            [ -z "$CHAT" ] && continue
            curl -sS -o /tmp/tg.json \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=${TEXT}" \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" || true
            jq -e '.ok == true' /tmp/tg.json >/dev/null 2>&1 \
              && echo "Telegram: failure message sent to $CHAT" \
              || echo "::warning::Telegram failure message failed for $CHAT"
          done

      - name: Create GitHub release
        if: github.event.inputs.publish_release == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.img
            ${{ env.SRC_DIR }}/out/target/product/begonia/*.zip
          generate_release_notes: true
